<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Polaroid</title>
    <link rel="stylesheet" href="./css/editorial.css" />
  </head>

  <body>
  <section class="editingPanel">
    <div class="container">
      <!-- For home button and save Button -->
      <div class="buttonsDiv">
        <button class="btn home" id="home">Home</button>
     
         <button class="btn" id="imgInpBtn">Select Images</button>
      </div>

      <!-- Polaroid -->
      <div class="polaroidDiv">
        <div class="polaroid1 hide polaroidLayout" id="onePic">
          <img id="onePhoto1" src="./assets/noImg.jpg" alt="" class="img" />
        </div>
        <div class="polaroid3 hide polaroidLayout" id="threePics">
          <img id="threePhoto1" src="./assets/noImg.jpg" alt="" class="img" />
          <img id="threePhoto2" src="./assets/noImg.jpg" alt="" class="img" />
          <img id="threePhoto3" src="./assets/noImg.jpg" alt="" class="img" />
        </div>

        <div class="polaroid4 hide polaroidLayout" id="fourPics">
          <img id="fourPhoto1" src="./assets/noImg.jpg" alt="" class="img" />
          <img id="fourPhoto2" src="./assets/noImg.jpg" alt="" class="img" />
          <img id="fourPhoto3" src="./assets/noImg.jpg" alt="" class="img" />
          <img id="fourPhoto4" src="./assets/noImg.jpg" alt="" class="img" />
        </div>
      </div>

       <button class="btn disable" id="save">Save</button>
      <input
    type="file"
    id="imageInput"
    accept="image/*"
    multiple
    hidden
>

      <!-- Editing panel -->
      <div class="editing">
        <div class="features">
          <button class="feat" id="colorBtn">Color</button>
          <button class="feat" id="designBtn" >Frame</button>
          <button class="feat" id="stickerBtn">Stickers</button>
        </div>

        <div class="relevantFeatures">
          <!-- <button class="color" id="red"></button>
          <button class="color" id="pink"></button>
          <button class="color" id="black"></button>
          <button class="color" id="white"></button>
          <button class="color" id="yellow"></button>
          <button class="color" id="orange"></button>
          <button class="color" id="blue"></button>
          <button class="color" id="green"></button>
          <button class="color" id="sky"></button>
          <button class="color" id="purple"></button>
          <button class="color" id="gray"></button> -->
        </div>
      </div>
    </div>
    </section>

    <!-- Download section -->
 <section class="downloadSection  hide">
     <div class="container">
      <!-- HOme button -->
         <button class="topBtn home">Home</button>

      <!-- For animation of developing -->
      <div class="developed">
        <div class="topPart"></div>
        <div class="bottomPart"></div>
        <!-- Final polaroid -->
        <div class="developedPolaroid"></div>
      </div>
        <!-- Download and print button -->
       <div class="finishedStateBtns">
         <button class="finiBtn"  id="downloadBtn">Download</button>
         <button class="finiBtn" id="printBtn" >Print</button>
      </div>

      </div>
 </section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="./js/editingPage.js"></script>
  </body>
</html>
