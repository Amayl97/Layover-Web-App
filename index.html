<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layover - Frame your memories</title>
    <!-- CSS file -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- Black And White Picture Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Archivo+Black&family=Betania+Patmos&family=Black+And+White+Picture&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Caveat:wght@400..700&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Dancing+Script:wght@400..700&family=Fredoka:wght@300..700&family=Handlee&family=Playwrite+NZ+Guides&display=swap" rel="stylesheet">
<!-- Rubik Bubbles Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Archivo+Black&family=Betania+Patmos&family=Black+And+White+Picture&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Caveat:wght@400..700&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Dancing+Script:wght@400..700&family=Fredoka:wght@300..700&family=Handlee&family=Playwrite+NZ+Guides&family=Rubik+Bubbles&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Select Frame Layout</h1>

        <div class="layoutOption">
            <div class="option" id="onePic">
                <p>Single Image Polaroid</p>
                <img src="./assets/img.jpg" alt="" class="imgIcon">
            </div>
            <!-- Three pics -->
             <div class="option" id="threePics">
                <p>Three Images Polaroid</p>
                <img src="./assets/img.jpg" alt="" class="imgIcon">
            </div>
            <!-- Four pics -->
             <div class="option" id="fourPics">
                <p>Four Images Polaroid</p>
                <img src="./assets/img.jpg" alt="" class="imgIcon">
            </div>
        </div>

        <div class="image">
            <img src="./assets/imgPolaroid.jpg" alt="">
        </div>
    </div>
</body>
</html>
